
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ocean Blue Calculator</title>
    <link rel="stylesheet" href="normal.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main class="container">
        <section class="calculator">
            <div class="calculator-heading">
                <h2>My Calculator</h2>
                <p>Calculate with ease</p>
            </div>

            <input
                type="text"
                id="display"
                placeholder="0"
                readonly
                aria-label="Calculator display"
            >

            <div class="buttons">
                <button class="clear" data-value="C">C</button>
                <button class="delete" data-value="DEL">DEL</button>
                <button class="operator" data-value="(">(</button>
                <button class="operator" data-value=")">)</button>

                <button data-value="7">7</button>
                <button data-value="8">8</button>
                <button data-value="9">9</button>
                <button class="operator" data-value="/">÷</button>

                <button data-value="4">4</button>
                <button data-value="5">5</button>
                <button data-value="6">6</button>
                <button class="operator" data-value="*">×</button>

                <button data-value="1">1</button>
                <button data-value="2">2</button>
                <button data-value="3">3</button>
                <button class="operator" data-value="-">−</button>

                <button data-value="0">0</button>
                <button data-value=".">.</button>
                <button class="operator" data-value="+">+</button>
                <button class="equals" data-value="=">=</button>
            </div>

            <p class="footer-text">Ocean Blue 💙</p>

        </section>

    </main>

    <footer>
        <p> Calculator | Web UI Design</p>
    </footer>

</body>
</html>
